<text x="32" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#6EE7B7">$</text><text x="52" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#E6EDF3">whoami</text><rect class="c0" x="50" y="57" width="68" height="24" fill="#0B0E13"/><text x="52" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#E6EDF3">hamza  /  software engineer  /  university of lahore</text><rect class="c1" x="50" y="85" width="528" height="24" fill="#0B0E13"/><text x="32" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#6EE7B7">$</text><text x="52" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#E6EDF3">cat focus.txt</text><rect class="c2" x="50" y="113" width="138" height="24" fill="#0B0E13"/><text y="158" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15"><tspan x="52" fill="#7D8590">building</tspan><tspan x="172" fill="#E6EDF3">full-stack products, from schema to deploy</tspan></text><rect class="c3" x="50" y="141" width="548" height="24" fill="#0B0E13"/><text y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15"><tspan x="52" fill="#7D8590">exploring</tspan><tspan x="172" fill="#E6EDF3">machine learning, data analysis, LLM-powered apps</tspan></text><rect class="c4" x="50" y="169" width="618" height="24" fill="#0B0E13"/><text x="32" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#6EE7B7">$</text><text x="52" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#E6EDF3">ls projects/</text><rect class="c5" x="50" y="197" width="128" height="24" fill="#0B0E13"/><text x="52" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#6EE7B7">freelancing-marketplace/   rental-platform/   job-tracker/</text><rect class="c6" x="50" y="225" width="588" height="24" fill="#0B0E13"/>
