<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Terminal: whoami, current focus, and project list">
<style>
@keyframes appear{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes rv0{from{transform:translateX(0)}to{transform:translateX(68px)}}.c0{animation:rv0 0.40s steps(6,end) 0.60s both}@keyframes rv1{from{transform:translateX(0)}to{transform:translateX(528px)}}.c1{animation:rv1 1.56s steps(52,end) 1.45s both}@keyframes rv2{from{transform:translateX(0)}to{transform:translateX(138px)}}.c2{animation:rv2 0.40s steps(13,end) 3.26s both}@keyframes rv3{from{transform:translateX(0)}to{transform:translateX(548px)}}.c3{animation:rv3 1.62s steps(54,end) 4.11s both}@keyframes rv4{from{transform:translateX(0)}to{transform:translateX(618px)}}.c4{animation:rv4 1.83s steps(61,end) 5.98s both}@keyframes rv5{from{transform:translateX(0)}to{transform:translateX(128px)}}.c5{animation:rv5 0.40s steps(12,end) 8.06s both}@keyframes rv6{from{transform:translateX(0)}to{transform:translateX(588px)}}.c6{animation:rv6 1.74s steps(58,end) 8.91s both}
.cur{animation:blink 1.1s steps(1) infinite}
</style>
